<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ymir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="shared/views.css">
<script src="config.js"></script>
<style>
  html, body { height: 100%; }
  body { line-height: 1.4; overflow: hidden; display: grid; grid-template-rows: 52px minmax(0, 1fr);
    grid-template-columns: 380px minmax(0, 1fr); grid-template-areas: "top top" "panel main"; }
  /* A building gets its own rail of sheets and the full-height Build / Ask panel on the right */
  body.mode-project { grid-template-columns: 264px minmax(0, 1fr) 388px; grid-template-areas: "top top top" "rail main panel"; }
  body.mode-drawing .proj-only, body.mode-project .draw-only, body:not(.mode-project) .rail { display: none !important; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Build / Ask panel: left of the views for a drawing, right of them for a building */
  aside { grid-area: panel; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  body.mode-project aside { border-right: 0; border-left: 1px solid var(--line); }
  .rail { grid-area: rail; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  .rail-h { display: flex; align-items: center; gap: 6px; padding: 14px 18px 2px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .rail-h span { flex: 1; }
  .rail-h button { border: 0; background: none; color: var(--ink-2); font-size: 12px; padding: 2px 4px; border-radius: 6px; }
  .rail-h button:hover { color: var(--ink); background: var(--bg); }
  .cover { margin: 10px 14px 2px; }
  .cover .meter { height: 6px; border-radius: 3px; background: #ece8df; overflow: hidden; }
  .cover .meter i { display: block; height: 100%; border-radius: 3px; background: var(--ok); transition: width .4s; }
  .cover small { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-2); }
  .sheethead { margin: 12px 12px 0; padding: 8px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .sheethead small { color: var(--ink-3); font-size: 11px; }
  .sheethead b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheethead span { color: var(--ink-2); font-size: 12px; }
  .dmeta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 12px 0; }
  .dmeta span { font-size: 11.5px; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; }
  .src { display: flex; gap: 10px; align-items: center; margin: 12px 12px 0; padding: 8px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
  .src img { width: 46px; height: 46px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .src div { flex: 1; min-width: 0; font-weight: 500; }
  .src small { display: block; color: var(--ink-2); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src button { border: 0; background: var(--bg); border-radius: 8px; height: 30px; padding: 0 10px; font-size: 13px; }
  /* Project tree: levels top to bottom, then sheets waiting for a level and sheets not in 3D */
  .tree { flex: 1; min-height: 0; overflow: auto; margin: 0 8px; padding-bottom: 12px; }
  .lvl-h { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; padding: 10px 8px 2px; font-size: 11.5px; color: var(--ink-3); }
  .lvl-h span { flex: 1 0 auto; }
  .chip-g { border: 1px dashed #cbc5b8; background: none; border-radius: 10px; font-size: 11px; color: var(--ink-2); padding: 0 7px; height: 19px; white-space: nowrap; }
  .chip-g:hover, .chip-g.on { border-color: var(--answer); color: var(--answer); }
  .trow { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; border-radius: 8px; padding: 5px 8px; text-align: left; font-size: 13px; }
  .trow:hover { background: var(--bg); }
  .trow.on { background: #fff; box-shadow: 0 0 0 1px var(--line); }
  .trow.ghost { color: var(--ink-2); }
  .trow.ghost.on { box-shadow: 0 0 0 1px var(--answer); }
  .trow .lab { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow small { margin-left: auto; color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-sizing: border-box; }
  .dot.placed { background: var(--ok); } .dot.pending { border: 2px solid var(--place); }
  .dot.ghost { border: 1.5px dashed var(--ghost); } .dot.attached { border-radius: 2px; background: var(--ink-3); }
  .addrow { color: var(--ink-2); font-size: 12.5px; }
  .ghostcard { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; background: rgba(251,250,246,.9); }
  .ghostcard[hidden], .vnote[hidden], #base2d[hidden] { display: none; }
  .ghostcard > div { max-width: 320px; text-align: center; border: 1.5px dashed #cbc5b8; border-radius: 14px; padding: 22px 20px; background: var(--panel); color: var(--ink-2); font-size: 13px; }
  .ghostcard b { display: block; color: var(--ink); font-weight: 500; font-size: 15px; margin-bottom: 4px; }
  .ghostcard .btn { margin-top: 12px; }
  .v > .vnote { position: absolute; inset: auto; left: 12px; top: 12px; z-index: 3; max-width: calc(100% - 24px); background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 12.5px; color: var(--ink-2); pointer-events: none; }
  .vnote b { color: var(--ink); font-weight: 500; }
  .vnote.place { border-color: var(--place); }
  #base2d { position: absolute; inset: 0; z-index: 1; background: var(--plan-bg); }
  .pts { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
  .pt { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--place); color: var(--place); display: grid; place-items: center; font-size: 11px; font-weight: 600; }
  .pt.on { background: var(--place); color: #fff; }
  .plan2d .badge.pt circle { fill: var(--place); stroke: #fff; }
  .plan2d .badge.pt text { fill: #fff; }
  .sel { height: 34px; border: 1px solid var(--line); border-radius: 9px; background: #fff; padding: 0 8px; font: inherit; min-width: 0; }
  .needs { margin-top: 8px; display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--answer); color: var(--answer); background: none; border-radius: 9px; padding: 4px 10px; font-size: 12.5px; }
  .needs:hover { background: #eef3fe; }
  .tabs { display: flex; margin: 12px 12px 0; background: #ece8df; border-radius: 10px; padding: 3px; }
  .tabs button { flex: 1; height: 32px; border: 0; background: none; border-radius: 8px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tabs button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .tabs svg { width: 15px; height: 15px; }
  .tabs .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  .flow { flex: 1; overflow: auto; padding: 18px 12px 12px; }
  .node { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 0 6px 16px; }
  .node::before { content: ''; position: absolute; left: 19px; top: 26px; bottom: -2px; width: 2px; background: var(--line); }
  .node:last-child::before { display: none; }
  .node.skip::before { background: repeating-linear-gradient(var(--line) 0 4px, transparent 4px 8px); }
  .st { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); color: var(--ink-3); border: 2px solid var(--line); z-index: 1; }
  .st svg { width: 14px; height: 14px; stroke-width: 2.6; }
  .done .st { background: var(--ok); border-color: var(--ok); color: #fff; }
  .you .st { background: #fff; border-color: var(--accent); color: var(--accent); }
  .you .st::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .skip .st { border-style: dashed; }
  .hd { display: flex; align-items: baseline; gap: 8px; cursor: pointer; padding-top: 4px; }
  .hd b { font-weight: 500; }
  .tool { font: 500 11px var(--mono); color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  .res { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
  .skip .hd b, .skip .res { color: var(--ink-3); }
  .act { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .grow { flex: 1; }
  .num { display: flex; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 36px; padding: 0 10px 0 4px; }
  .num input { width: 64px; border: 0; font: 500 15px var(--mono); text-align: right; outline: none; background: none; }
  .num span { color: var(--ink-2); margin-left: 4px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: #fff; white-space: nowrap; }
  .btn:hover { border-color: #cbc5b8; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.acc { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
  .btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn svg { width: 15px; height: 15px; }
  .chip { font-size: 12px; color: var(--ink-2); }
  .chip.good { color: var(--ok); }
  .cands { display: flex; gap: 6px; }
  .cand { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 4px; border: 1px solid var(--line); background: #fff; border-radius: 9px; font-size: 12px; color: var(--ink-2); }
  .cand b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--accent); color: var(--accent); font-size: 12px; }
  .cand.on { border-color: var(--accent); background: #fdf1eb; color: var(--ink); }
  .cand.on b { background: var(--accent); color: #fff; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 14px; height: 4px; border-radius: 2px; }

  /* Ask */
  .askp { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .askp[hidden], .flow[hidden] { display: none; }
  .thread { flex: 1; overflow: auto; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto 6px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .msg { max-width: 92%; border-radius: 14px; padding: 9px 12px; font-size: 14px; }
  .msg.q { align-self: flex-end; background: var(--ink); color: #fff; border-bottom-right-radius: 4px; }
  .msg.a { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; cursor: pointer; }
  .msg.a.on { border-color: var(--answer); box-shadow: 0 0 0 3px rgba(37,99,235,.08); }
  .msg.a.pending { display: flex; align-items: center; gap: 8px; color: var(--ink-2); cursor: default; }
  .msg.a.abstain { background: #faf7f0; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--answer); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  cite { font-style: normal; display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 4px; margin: 0 1px; border-radius: 9px; background: var(--answer); color: #fff; font-size: 11px; font-weight: 600; vertical-align: 1px; cursor: pointer; }
  .cites { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
  .cites div { display: flex; gap: 6px; align-items: center; }
  .cites cite { min-width: 15px; height: 15px; font-size: 10px; }
  .sugg { display: flex; gap: 6px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
  .sugg button { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 16px; padding: 5px 10px; font-size: 12.5px; color: var(--ink-2); }
  .sugg button:hover { border-color: var(--answer); color: var(--answer); }
  .composer { display: flex; gap: 6px; margin: 0 12px 12px; padding: 5px 5px 5px 12px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
  .composer:focus-within { border-color: var(--answer); }
  .composer input { flex: 1; border: 0; outline: none; font: inherit; background: none; }
  .composer button { width: 34px; height: 34px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; display: grid; place-items: center; }
  .composer button[disabled] { opacity: .35; }

  /* Main */
  main { grid-area: main; overflow: hidden; position: relative; display: grid; grid-template-rows: 56px 1fr auto; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 0 16px; min-width: 0; }
  .seg { display: flex; background: #e9e5dc; border-radius: 10px; padding: 3px; }
  .seg button { height: 30px; padding: 0 14px; border: 0; background: none; border-radius: 8px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .seg svg { width: 15px; height: 15px; }
  .spacer { flex: 1; }
  .icon { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); }
  .icon.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px 10px; min-height: 0; }
  .views.one-plan { grid-template-columns: 1fr 0; } .views.one-model { grid-template-columns: 0 1fr; }
  .views.one-plan .v.model, .views.one-model .v.plan { visibility: hidden; }
  .v { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .v > div { position: absolute; inset: 0; }
  .hgt { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
  .hgt input { width: 46px; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 6px; font: 500 13px var(--mono); text-align: right; }

  /* Trace */
  .trace { margin: 0 16px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); overflow: hidden; }
  .trace header { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 14px; cursor: pointer; }
  .trace header b { font-weight: 500; }
  .trace header .status { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .trace header .status .spin { width: 12px; height: 12px; }
  .trace header button { margin-left: auto; width: 30px; height: 30px; border: 0; background: none; border-radius: 8px; color: var(--ink-2); display: grid; place-items: center; transition: transform .2s; }
  .trace.closed header button { transform: rotate(180deg); }
  .trace .chartwrap { overflow-x: auto; border-top: 1px solid var(--line); }
  .trace.closed .chartwrap { display: none; }
  .trace-chart { position: relative; height: 224px; min-width: 820px; }
  .trace-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tedge { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke .3s; }
  .tedge.active { stroke: var(--answer); stroke-dasharray: 6 6; animation: flow .5s linear infinite; }
  .tedge.done { stroke: #9db4ee; }
  .tedge.skip { stroke-dasharray: 2 5; opacity: .6; }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .tnode { position: absolute; height: 44px; padding: 5px 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; font-size: 12px; transition: left .3s, top .3s, border-color .25s, box-shadow .25s, opacity .25s; animation: tn-in .3s ease-out; }
  @keyframes tn-in { from { opacity: 0; transform: translateY(4px); } }
  .tnode.fail { border-color: var(--flag); }
  .tedge.fail { stroke: var(--flag); }
  .node.fail .st { border-color: var(--flag); color: var(--flag); }
  .tn-h { display: flex; align-items: center; gap: 6px; }
  .tn-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .tn-h b { font-weight: 600; }
  .tn-h span { margin-left: auto; font: 500 10px var(--mono); color: var(--ink-2); background: var(--bg); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
  .tn-o { margin-top: 2px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tnode.idle { opacity: .55; }
  .tnode.run { border-color: var(--answer); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  .tnode.run i { background: var(--answer); animation: pulse .8s infinite; }
  .tnode.done i { background: var(--ok); }
  .tnode.skip { border-style: dashed; opacity: .5; }
  .tnode.you { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(224,89,42,.14); }
  .tnode.you i { background: var(--accent); animation: pulse 1.2s infinite; }

  /* Low-confidence answer: the user checks the model's boxes */
  .msg.a.review { max-width: 100%; border-color: var(--accent); cursor: default; }
  .msg.a.review .act { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .warn { color: var(--accent); font-weight: 500; }
  .mark { margin-top: 6px; font-size: 12px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .mark.ok { color: var(--ok); }
  .mark svg { width: 14px; height: 14px; stroke-width: 2.4; }
  .mark a { color: var(--answer); text-decoration: none; margin-left: auto; }
  .mark a:hover { text-decoration: underline; }

  .icon[hidden] { display: none; }
  @media (max-width: 1280px) { body.mode-project { grid-template-columns: 236px minmax(0, 1fr) 344px; } }
  /* Smaller screens: narrower side columns and a compact toolbar so the views keep their room */
  @media (max-width: 1180px) {
    body.mode-project { grid-template-columns: 216px minmax(0, 1fr) 316px; }
    body.mode-drawing { grid-template-columns: 330px minmax(0, 1fr); }
    .bar { padding: 0 10px; gap: 6px; }
    .seg button { padding: 0 9px; }
    .seg svg { display: none; }
    .hgt { font-size: 0; gap: 0; }
    .hgt input { font-size: 13px; }
    .tb-btn .lbl { display: none; }
  }
  @media (max-width: 1100px) {
    .views:not(.one-plan):not(.one-model) { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .views.one-plan { grid-template-columns: 1fr; grid-template-rows: 1fr 0; } .views.one-model { grid-template-columns: 1fr; grid-template-rows: 0 1fr; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; }
    body, body.mode-project { overflow: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: 52px; grid-auto-rows: auto;
      grid-template-areas: "top" "rail" "main" "panel"; }
    body.mode-drawing { grid-template-areas: "top" "panel" "main"; }
    .rail { max-height: 45vh; border-right: 0; border-bottom: 1px solid var(--line); }
    aside, body.mode-project aside { max-height: 75vh; border: 0; border-bottom: 1px solid var(--line); }
    main { min-height: 90vh; }
    .hgt, .crumbs .kind-tag, .tb-btn .lbl { display: none; }
  }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/OrbitControls.js": "./vendor/OrbitControls.js" } }</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" title="About Ymir"><i></i>Ymir</a>
  <nav class="crumbs"><a href="home.html">Home</a><span class="sep">/</span><span class="kind-tag" id="crumbKind">…</span><b id="crumbTitle"></b></nav>
  <div class="tb-actions">
    <button class="tb-btn draw-only" id="toBuilding" title="Start a building with this drawing as its ground floor"><span data-i="layers"></span><span class="lbl">Start a building from this</span></button>
    <label class="tb-btn draw-only" title="Open another drawing"><span data-i="up"></span><span class="lbl">Upload another</span><input type="file" accept="image/png,image/jpeg,image/webp" hidden id="uploadAnother"></label>
    <button class="tb-btn proj-only" id="addLevel" title="Add a storey on top"><span data-i="plus"></span><span class="lbl">Add level</span></button>
    <button class="tb-btn primary proj-only" id="addSheetTop" title="Add a sheet to this building"><span data-i="up"></span><span class="lbl">Add sheet</span></button>
  </div>
</header>
<nav class="rail">
  <div class="src"><img id="pThumb" alt=""><div><span id="pTitle">…</span><small id="pSub"></small></div></div>
  <div class="cover" title="How much of the building has a sheet"><div class="meter"><i id="pCover"></i></div><small id="pCoverText"></small></div>
  <div class="rail-h"><span>Sheets</span><button id="collapseGhosts" title="Show or hide missing sheets">Hide missing</button></div>
  <div class="tree" id="tree"></div>
</nav>
<aside>
  <div class="src draw-only"><img id="dThumb" alt=""><div><span id="dTitle">…</span><small id="dSub"></small></div></div>
  <div class="dmeta draw-only" id="dMeta"></div>
  <div class="sheethead proj-only" id="sheetHead"></div>
  <div class="tabs">
    <button data-tab="build" class="on"><span data-i="cube"></span>Build</button>
    <button data-tab="ask"><span data-i="chat"></span>Ask<span class="dot" id="askDot" hidden></span></button>
  </div>
  <div class="flow" id="flow"></div>
  <div class="askp" id="askp" hidden>
    <div class="thread" id="thread"></div>
    <div class="sugg" id="sugg"></div>
    <form class="composer" id="composer"><input id="qin" placeholder="Ask about this drawing" autocomplete="off"><button id="send" disabled><span data-i="up"></span></button></form>
  </div>
</aside>
<main>
  <div class="bar">
    <div class="seg" id="seg">
      <button data-v="one-plan"><span data-i="plan"></span>Drawing</button>
      <button data-v="both" class="on">Both</button>
      <button data-v="one-model"><span data-i="cube"></span>3D</button>
    </div>
    <div class="spacer"></div>
    <label class="hgt">Height <input id="height" value="2.7"> m</label>
    <button class="icon proj-only" id="isolate" title="Show only this sheet’s level"><span data-i="focus"></span></button>
    <button class="icon proj-only" id="explode" title="Spread levels apart"><span data-i="layers"></span></button>
    <button class="icon" id="drawTool" title="Draw a missing wall"><span data-i="pen"></span></button>
    <button class="icon" id="fit" title="Fit"><span data-i="fit"></span></button>
  </div>
  <div class="views" id="views">
    <div class="v plan"><div id="plan"></div><div class="ghostcard" id="ghostcard" hidden></div><div class="vnote" id="note2d" hidden></div></div>
    <div class="v model"><div id="model"></div><div id="base2d" hidden></div><div class="vnote" id="note3d" hidden></div></div>
  </div>
  <section class="trace" id="trace">
    <header id="traceHead"><b>Trace</b><span class="status" id="traceStatus">Ask a question to see how it’s answered</span><button title="Collapse"><span data-i="chev"></span></button></header>
    <div class="chartwrap"><div id="chart"></div></div>
  </section>
</main>

<div class="tip" id="tip" hidden></div>
<input type="file" accept="image/png,image/jpeg,image/webp" hidden id="addFile">

<script type="module">
import { createSession, bindViews, wallPx, needsReview, countNoun } from './shared/session.js';
import { createPlan } from './shared/plan2d.js';
import { createViewer } from './shared/viewer3d.js';
import { createTrace } from './shared/trace.js';
import { ask as askAgents, suggestions, previewGraph, submitReview, uploadDrawing, loadDrawing, loadProject } from './shared/api.js';
import { loadThread, saveThread, getLocalProject, createLocalProject, touchRecent, nextLevel } from './shared/store.js';
import { $, h, toast, icon } from './shared/ui.js';
import { KINDS, kindOf, isPlan, isPlaceable, guessKind, applyT, scaleOf, solveSimilarity, elevationFrame, footprint, ghostSlots,
  ghostFor, levelsByZ, levelRole, views, singleSheetProject, placementFor, baseView, transformOf, isPlaced, mergeOverlay,
  loadOverlay, saveOverlay } from './shared/project.js';

document.querySelectorAll('[data-i]').forEach((n) => { n.outerHTML = icon[n.dataset.i]; });
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const session = createSession({ pickRef: true });
const S = session.state;
const plan = createPlan($('#plan'));
const viewer = createViewer($('#model'));
const trace = createTrace($('#chart'));
const basePlan = createPlan($('#base2d')); // the base sheet, shown in the 3D panel while another sheet is placed

// Clicks on walls mean different things per stage; a click on another sheet in 3D opens it
bindViews(session, {
  plan, viewer, tooltip: $('#tip'),
  onPick(sel) {
    if (sel?.type === 'sheet') { selectSheet(sel.id); return; }
    if (sel?.type === 'box') { session.toggleBox(sel.id); return; }
    if (sel?.type === 'wall' && S.focus === 'scale') {
      if (session.candidates().some((c) => c.id === sel.id)) session.setRef(sel.id);
      return;
    }
    if (sel?.type === 'wall' && S.focus === 'walls') { session.toggleWall(sel.id); return; }
    session.select(sel);
  },
});

/* ---------- Project: sheets, their places in the building, ghosts ---------- */
// manifest = the project as served (or built from one drawing); overlay = this viewer's changes on top of it.
let manifest = null, overlay = null, P = null;
const drawings = new Map(), snaps = new Map();
let activeId = null, ghostSel = null, needsGhost = null, explode = false, isolate = false, hideGhosts = false, placing = null;
let thread = []; // this project's conversation, kept in the browser (store.js)
const viewOf = (id) => P && views(P).find((v) => v.drawing_id === id && v.index === 0);
const levelOf = (id) => P?.levels.find((l) => l.id === id);
const levelName = (id) => levelOf(id)?.name || id || '';
function levelY(id) {
  const ls = levelsByZ(P), i = ls.findIndex((l) => l.id === id);
  return i < 0 ? 0 : ls[i].z_m + (explode ? i * 2.4 : 0);
}
const scaleFor = (id) => (id === activeId && S.d ? S.scale : snaps.get(id)?.scale ?? drawings.get(id)?.scale.m_per_px ?? 1);
const tOf = (v) => transformOf(v, scaleFor);
const sheetLabel = (id) => { const d = drawings.get(id); return d ? `${d.sheet_number ? `${d.sheet_number} ` : ''}${d.title}` : id || ''; };
const isBase = () => baseView(P)?.drawing_id === activeId;
const merged = () => { const m = mergeOverlay(manifest, overlay); return { ...m, sheets: m.sheets.filter((s) => drawings.has(s.drawing_id)) }; };
function patchView(id, patch, { save = true } = {}) {
  const key = `${id}#0`;
  overlay.patch = { ...overlay.patch, [key]: { ...(overlay.patch?.[key] || {}), ...patch } };
  if (save) saveOverlay(P.id, overlay);
  P = merged();
}
function defaultLevel() { return baseView(P)?.placement.level || levelsByZ(P).find((l) => levelRole(l) === 'storey')?.id; }
function footprintPoly() {
  const b = baseView(P);
  if (!b) return null;
  const d = b.drawing_id === activeId && S.d ? { ...S.d, walls: S.d.walls.filter((w) => !session.removed().has(w.id)) } : drawings.get(b.drawing_id);
  return footprint(d, tOf(b));
}
const ghostList = () => (P ? ghostSlots(P) : []);
// What the 3D view shows around the active sheet: where it sits, the other placed sheets, the ghosts.
function sceneFor(id) {
  const v = viewOf(id);
  const placed = v && isPlaced(v);
  const activeY = placed && v.placement.type === 'plan' ? levelY(v.placement.level) : null;
  // sheets above this level fade so they don't hide it; an unplaced sheet uses the level it's meant for
  const fadeY = activeY ?? (v?.placement?.level && v.placement.type === 'plan' ? levelY(v.placement.level) : levelY(defaultLevel()));
  const place = !placed ? { type: 'hidden' }
    : v.placement.type === 'plan' ? { type: 'plan', t: tOf(v), y: activeY, opacity: placing?.step === 'check' ? 0.55 : 1 }
    : { type: 'elevation' };
  const others = [];
  const onlyLevel = isolate && v?.placement?.level ? v.placement.level : null;
  for (const o of views(P)) {
    if (o.index !== 0 || !isPlaced(o) || (o.drawing_id === id && o.placement.type === 'plan')) continue;
    if (onlyLevel && (o.placement.type !== 'plan' || o.placement.level !== onlyLevel)) continue;
    const d = drawings.get(o.drawing_id);
    if (o.placement.type === 'plan') {
      const y = levelY(o.placement.level);
      others.push({ id: o.drawing_id, drawing: d, place: { type: 'plan', t: tOf(o), y }, walls: o.kind === 'floor_plan',
        height: levelOf(o.placement.level)?.height_m ?? 3, faded: y > fadeY + 0.1 });
    } else {
      others.push({ id: o.drawing_id, drawing: d, place: { type: 'elevation', y: levelY(o.placement.level) },
        frame: elevationFrame(o.placement), active: o.drawing_id === id });
    }
  }
  const fp = footprintPoly();
  const ghosts = !fp || P.single ? [] : ghostList().filter((g) => !onlyLevel || g.level === onlyLevel).map((g) => {
    const y = levelY(g.level), hgt = levelOf(g.level)?.height_m ?? 3;
    const [y0, y1] = g.kind === 'roof' ? (g.onTop ? [y + hgt, y + hgt + 0.4] : [y, y + 0.4]) : g.kind === 'structure' ? [y - 0.3, y] : [y, y + hgt];
    return { ...g, polygon: fp, y0, y1, active: g.id === ghostSel || g.id === needsGhost };
  });
  return { place, walls: v?.kind === 'floor_plan', others, ghosts };
}
const refreshScene = (fit = false) => { if (P && activeId && S.d) viewer.setScene(sceneFor(activeId), { fit }); };

async function openProject(p, { sheet } = {}) {
  cancel?.(); cancel = null;
  document.body.classList.toggle('mode-project', !p.single);
  document.body.classList.toggle('mode-drawing', !!p.single);
  viewer.setKeepView(false);
  if (reviewing) skipReview();
  manifest = p; overlay = loadOverlay(p.id) || { added: [], patch: {} };
  drawings.clear(); snaps.clear();
  const all = mergeOverlay(manifest, overlay);
  await Promise.all(all.sheets.map((s) => loadDrawing(s.drawing_id).then((d) => drawings.set(s.drawing_id, d), () => {})));
  P = merged();
  if (!P.sheets.length) { toast('This project has no drawings left'); return; }
  activeId = null; ghostSel = null; needsGhost = null; placing = null; current = null; busy = false;
  history.replaceState(null, '', P.single ? `?d=${encodeURIComponent(P.sheets[0].drawing_id)}` : `?p=${encodeURIComponent(P.id)}`);
  restoreThread(); idleTrace();
  $('#send').disabled = true; $('#qin').placeholder = P.single ? 'Ask about this drawing' : 'Ask about this building';
  $('#trace').classList.toggle('closed', !P.single); // a building needs the room for its views until a question is asked
  await selectSheet(sheet || baseView(P)?.drawing_id || P.sheets[0].drawing_id, { fit: true });
  // the mode switch resizes the panels; frame the building again once the layout has settled
  requestAnimationFrame(() => requestAnimationFrame(() => viewer.fit()));
  viewer.setKeepView(true); // from here on, switching sheets keeps the camera where the user left it
  const d = drawings.get(baseView(P)?.drawing_id || P.sheets[0].drawing_id);
  touchRecent({ id: P.single ? P.sheets[0].drawing_id : P.id, type: P.single ? 'drawing' : 'project', title: P.title, thumbnail: d?.image.url });
  setTab(thread.length ? 'ask' : 'build');
}
// Questions asked earlier in this browser, shown again (click one to see its evidence).
function restoreThread() {
  thread = loadThread(P.id);
  if (!thread.length) { emptyThread(); return; }
  $('#thread').replaceChildren();
  for (const entry of thread) {
    $('#thread').append(h(`<div class="msg q">${esc(entry.q)}</div>`));
    const card = h('<div class="msg a"></div>');
    $('#thread').append(card);
    showAnswer(entry, card, { quiet: true });
  }
}
async function openDrawing(id) { await openProject(singleSheetProject(await loadDrawing(id))); }

async function selectSheet(id, { fit = false } = {}) {
  if (placing) cancelPlacing();
  if (reviewing && id !== activeId) skipReview();
  ghostSel = null;
  showGhostCard(null);
  if (id === activeId) { renderTree(); refreshScene(fit); return; }
  if (activeId && S.d) snaps.set(activeId, session.snapshot());
  activeId = id; open = null;
  const snap = snaps.get(id);
  if (snap) session.restore(snap); else await session.open(id);
  refreshScene(fit);
  renderNotes();
}

function renderHead() {
  const d = S.d;
  document.title = `${P.title} · Ymir`;
  $('#crumbKind').textContent = P.single ? 'Drawing' : 'Building';
  $('#crumbTitle').textContent = P.title;
  if (P.single) {
    $('#dTitle').textContent = d.title;
    $('#dSub').textContent = [d.source?.dataset, d.source?.kind].filter(Boolean).join(' · ');
    $('#dThumb').src = d.image.url;
    const scale = `${(S.scale * 100).toFixed(2)} cm/px · ${S.scaleConfirmed ? 'confirmed' : d.scale.source === 'model' ? 'from model' : 'estimate'}`;
    $('#dMeta').innerHTML = [`${d.image.size[0]}×${d.image.size[1]} px`, scale, `${d.walls.length} walls`, `${d.rooms.length} rooms`].map((t) => `<span>${esc(t)}</span>`).join('');
    return;
  }
  const vs = views(P).filter((v) => v.index === 0), placed = vs.filter(isPlaced).length;
  const missing = ghostList().length, expected = ghostSlots({ ...P, sheets: [] }).length;
  const cover = expected ? 1 - missing / expected : 1;
  $('#pTitle').textContent = P.title;
  $('#pSub').textContent = `${P.sheets.length} sheet${P.sheets.length === 1 ? '' : 's'} · ${placed} in 3D · ${P.levels.length} levels`;
  $('#pThumb').src = drawings.get(baseView(P)?.drawing_id)?.image.url || d.image.url;
  $('#pCover').style.width = `${Math.round(cover * 100)}%`;
  $('#pCoverText').textContent = `${Math.round(cover * 100)}% of the building has a sheet · ${missing} missing`;
  const v = viewOf(activeId);
  $('#sheetHead').innerHTML = `<small>Working on</small><b>${esc(sheetLabel(activeId))}</b><span>${esc(kindOf(v?.kind).label)}${v?.placement?.level ? ` · ${esc(levelName(v.placement.level))}` : ''}${v && !isPlaced(v) && isPlaceable(v.kind) ? ' · not placed yet' : ''}</span>`;
}

function renderTree() {
  if (!P) return;
  const vs = views(P).filter((v) => v.index === 0);
  const ghosts = hideGhosts ? [] : ghostList();
  const sheetRow = (v) => {
    const d = drawings.get(v.drawing_id);
    const st = v.placement.type === 'attached' ? 'attached' : isPlaced(v) ? 'placed' : 'pending';
    return `<button class="trow ${v.drawing_id === activeId && !ghostSel ? 'on' : ''}" data-sheet="${esc(v.drawing_id)}" title="${esc(sheetLabel(v.drawing_id))}">
      <span class="dot ${st}"></span><span class="lab">${esc(sheetLabel(v.drawing_id))}</span><small>${st === 'pending' ? 'place it' : esc(kindOf(v.kind).label)}</small></button>`;
  };
  const ghostRow = (g) => `<button class="trow ghost ${g.id === ghostSel ? 'on' : ''}" data-ghost="${g.id}"><span class="dot ghost"></span><span class="lab">${g.label}</span><small>missing</small></button>`;
  const chip = (g) => `<button class="chip-g ${g.id === ghostSel ? 'on' : ''}" data-ghost="${g.id}" title="No ${g.noun} for this level">+ ${g.label}</button>`;
  const rows = [];
  const top = ghosts.find((g) => g.onTop);
  if (top) rows.push(`<div class="lvl-h"><span>Roof</span></div>${ghostRow(top)}`);
  for (const lv of [...levelsByZ(P)].reverse()) {
    const here = vs.filter((v) => v.placement.type !== 'attached' && v.placement.level === lv.id);
    const gs = ghosts.filter((g) => g.level === lv.id && !g.onTop);
    const small = gs.filter((g) => g.kind === 'structure' || g.kind === 'plumbing');
    rows.push(`<div class="lvl-h"><span>${esc(lv.name)}</span>${small.map(chip).join('')}</div>${here.map(sheetRow).join('')}${gs.filter((g) => !small.includes(g)).map(ghostRow).join('')}`);
  }
  const loose = vs.filter((v) => v.placement.type !== 'attached' && !levelOf(v.placement.level));
  if (loose.length) rows.push(`<div class="lvl-h"><span>To place</span></div>${loose.map(sheetRow).join('')}`);
  const att = vs.filter((v) => v.placement.type === 'attached');
  if (att.length) rows.push(`<div class="lvl-h"><span>Not in 3D</span></div>${att.map(sheetRow).join('')}`);
  rows.push(`<button class="trow addrow" data-add="1"><span class="dot"></span><span class="lab">+ Add a sheet to this building</span></button>`);
  $('#tree').innerHTML = rows.join('');
  $('#tree').querySelectorAll('[data-sheet]').forEach((b) => { b.onclick = () => selectSheet(b.dataset.sheet); });
  $('#tree').querySelectorAll('[data-ghost]').forEach((b) => { b.onclick = () => selectGhost(b.dataset.ghost); });
  $('#tree').querySelector('[data-add]').onclick = () => addSheet(null);
}

function selectGhost(id) {
  if (placing) cancelPlacing();
  ghostSel = ghostSel === id ? null : id;
  showGhostCard(ghostSel && ghostList().find((g) => g.id === ghostSel));
  renderTree(); refreshScene();
}
function showGhostCard(g) {
  const el = $('#ghostcard');
  el.hidden = !g;
  if (!g) return;
  if ($('#views').classList.contains('one-model')) setView('both');
  const why = { foundation: 'The dashed footings in 3D are guessed from the walls above.', level: 'The dashed box in 3D marks where it would go.',
    roof: 'The dashed plate in 3D marks where it would go.' }[g.kind] || 'Questions that need it will point here.';
  el.innerHTML = `<div><b>No ${g.noun} for ${esc(levelName(g.level).toLowerCase())} yet</b>${why}<br><button class="btn sm acc">${icon.up}Add ${g.noun}</button></div>`;
  el.querySelector('button').onclick = () => addSheet(g);
}

// A sheet for this building: from a ghost (its kind and level are known) or the tree's add row (guessed).
let pendingAdd = null;
function addSheet(ghost) { pendingAdd = { ghost }; $('#addFile').click(); }
$('#addFile').onchange = async () => {
  const file = $('#addFile').files[0];
  $('#addFile').value = '';
  if (!file || !P) return;
  const ghost = pendingAdd?.ghost;
  toast('Reading the drawing…');
  try {
    const entry = await uploadDrawing(file);
    const d = await loadDrawing(entry.id);
    const kind = ghost?.want || guessKind(d.title, file.name).kind;
    const level = ghost?.level || (isPlaceable(kind) ? defaultLevel() : null);
    drawings.set(d.id, d);
    overlay.added = [...(overlay.added || []), { drawing_id: d.id, views: [placementFor({ kind, kindSure: false }, level, isPlan(kind) && !baseView(P))] }];
    saveOverlay(P.id, overlay);
    P = merged();
    await selectSheet(d.id);
    setTab('build');
    toast(`${d.title} added · check what it is`);
  } catch (e) { toast(e.message || 'This drawing could not be read'); }
};

/* ---------- Build: steps for the active sheet, chosen by its kind ---------- */
let open = null, tab = 'build';
const len = (w) => wallPx(w) * S.scale;
const fmtMs = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(1)} s` : `${ms} ms`);
// Steps the backend reported in its build trace (node + status events), drawn as they arrived.
function backendSteps() {
  const steps = new Map();
  for (const e of S.build) {
    if (e.type === 'node') steps.set(e.id, { id: `b-${e.id}`, name: e.name, tool: e.tool, state: 'wait', res: '' });
    else if (e.type === 'status' && steps.has(e.id)) {
      const st = steps.get(e.id);
      st.state = { done: 'done', skipped: 'skip', failed: 'fail' }[e.state] || 'wait';
      st.res = (e.summary || '') + (e.ms ? ` · ${fmtMs(e.ms)}` : '');
    }
  }
  return [...steps.values()];
}
// ...followed by the steps that need the user, which the frontend owns.
function nodes() {
  const d = S.d, v = viewOf(activeId), kind = v?.kind || 'floor_plan', k = kindOf(kind);
  const list = [...backendSteps()];
  list.push({ id: 'kind', name: 'What is this', tool: 'You', state: v?.kindSure ? 'done' : 'you',
    res: `${k.label}${isPlaceable(kind) && v?.placement?.level ? ` · ${esc(levelName(v.placement.level))}` : ''}` });
  if (!v?.kindSure) return list;
  if (k.group === 'plan') {
    const cands = session.candidates(), ref = cands.find((c) => c.id === S.refId), model = d.scale.source === 'model';
    list.push({ id: 'confirm', name: 'Confirm scale', tool: model ? 'Model' : 'You', state: S.scaleConfirmed ? 'done' : cands.length ? 'you' : 'skip',
      res: model ? `From the model · ${d.scale.text || ''}` : S.scaleConfirmed ? (ref ? `Wall ${ref.letter} = ${session.refLength().toFixed(2)} m` : `${(S.scale * 100).toFixed(2)} cm per px`)
        : cands.length ? 'Pick a wall you know' : 'No walls to measure · placing sets it' });
    if (kind === 'floor_plan') {
      const pend = session.pending(), kept = d.walls.length - session.removed().size;
      list.push({ id: 'check', name: 'Check walls', tool: 'You', state: pend.length ? 'you' : 'done', res: pend.length ? `${pend.length} look doubtful` : `${kept} walls kept` });
    }
  }
  if (isPlaceable(kind) && !isBase()) {
    const on = isPlaced(v);
    list.push({ id: 'place', name: 'Place in building', tool: on && v.placement.by === 'model' ? 'Model' : 'You', state: placing ? 'you' : on ? 'done' : 'you',
      res: placing ? placingHint() : on ? `${esc(levelName(v.placement.level))} · ${v.placement.by === 'model' ? 'lined up by the model' : 'placed by you'}`
        : baseView(P) ? `Match 2 points with ${esc(sheetLabel(baseView(P).drawing_id))}` : 'Needs a floor plan first' });
  }
  if (isPlaceable(kind)) {
    const ready = isPlaced(v) && !session.pending().length;
    list.push({ id: 'model', name: '3D model', tool: 'three.js · IFC', state: ready ? 'done' : 'wait', res: ready ? 'In the building' : 'Updates live' });
  } else {
    list.push({ id: 'attached', name: 'Not in 3D', tool: 'Linked', state: 'skip', res: k.group === 'table' ? 'Tables are linked to the building, not placed' : 'Linked to the building, not placed' });
  }
  return list;
}
const firstYou = () => nodes().find((n) => n.state === 'you')?.id;

function kindAction() {
  const v = viewOf(activeId);
  const opts = (grp) => Object.entries(KINDS).filter(([, k]) => k.group === grp).map(([id, k]) => `<option value="${id}" ${id === v.kind ? 'selected' : ''}>${k.label}</option>`).join('');
  const lv = v.placement.level || defaultLevel();
  const levels = [...levelsByZ(P)].reverse().map((l) => `<option value="${l.id}" ${l.id === lv ? 'selected' : ''}>${esc(l.name)}</option>`).join('');
  const el = h(`<div class="act">
    <span class="chip">${v.kindSure ? 'Change it if it’s wrong.' : 'Guessed from its title and file name. Change it if it’s wrong.'}</span>
    <select class="sel" id="kSel"><optgroup label="Plans">${opts('plan')}</optgroup><optgroup label="Upright">${opts('upright')}</optgroup><optgroup label="Tables">${opts('table')}</optgroup><optgroup label="Other">${opts('other')}</optgroup></select>
    <div class="row"><span class="chip">Level</span><select class="sel grow" id="lSel">${levels}</select><button class="btn acc" id="kOk">${v.kindSure ? 'Save' : 'Confirm'}</button></div>
  </div>`);
  const sync = () => { el.querySelector('#lSel').disabled = !isPlaceable(el.querySelector('#kSel').value); };
  el.querySelector('#kSel').onchange = sync; sync();
  el.querySelector('#kOk').onclick = () => setKind(el.querySelector('#kSel').value, el.querySelector('#lSel').value);
  return el;
}
function setKind(kind, level) {
  const v = viewOf(activeId);
  const next = placementFor({ kind }, level, isPlan(kind) && (!baseView(P) || isBase())).placement;
  const placement = next.type === v.placement.type && next.type !== 'attached' ? { ...v.placement, level } : next;
  patchView(activeId, { kind, kindSure: true, discipline: kindOf(kind).discipline || null, placement });
  open = null; renderTree(); renderHead(); renderNotes(); refreshScene();
  const f = focusFor();
  if (S.focus !== f) session.setFocus(f); else renderFlow();
}

function scaleAction() {
  const cands = session.candidates();
  if (!cands.length) return h('<div class="act"><span class="chip">No walls to measure on this sheet. Placing it in the building sets its scale.</span></div>');

  drawing = on;
  if (!placing) plan.setMode(on ? (boxes ? 'box' : 'draw') : 'select');
  $('#drawTool').classList.toggle('on', on);
  document.querySelector('#drawBtn')?.classList.toggle('on', on);
  document.querySelector('#rvDraw')?.classList.toggle('on', on);
  if (on && !boxes && S.focus !== 'walls' && tab === 'build') setOpen('check');
}
$('#drawTool').onclick = () => setDrawing(!drawing);
$('#explode').onclick = () => { explode = !explode; $('#explode').classList.toggle('on', explode); refreshScene(true); };
$('#isolate').onclick = () => { isolate = !isolate; $('#isolate').classList.toggle('on', isolate); refreshScene(); };
$('#collapseGhosts').onclick = () => { hideGhosts = !hideGhosts; $('#collapseGhosts').textContent = hideGhosts ? 'Show missing' : 'Hide missing'; renderTree(); };
$('#fit').onclick = () => { plan.fit(); viewer.fit(); };
$('#height').onchange = (e) => session.setHeight(parseFloat(e.target.value));

/* ---------- Top bar: what a drawing and a building each offer ---------- */
// A drawing can become the ground floor of a new building (kept in this browser).
$('#toBuilding').onclick = () => {
  const v = viewOf(activeId);
  const p = createLocalProject({ title: `${S.d.title} building`, drawing: S.d, kind: v?.kind || 'floor_plan', kindSure: !!v?.kindSure });
  location.href = `app.html?p=${encodeURIComponent(p.id)}`;
};
$('#uploadAnother').onchange = async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  toast('Reading the drawing…');
  try { const entry = await uploadDrawing(file); location.href = `app.html?d=${encodeURIComponent(entry.id)}`; }
  catch (err) { toast(err.message || 'This drawing could not be read'); }
};
$('#addSheetTop').onclick = () => addSheet(null);
$('#addLevel').onclick = () => {
  const lv = nextLevel(P.levels);
  overlay.levels = [...P.levels, lv];
  saveOverlay(P.id, overlay);
  P = merged();
  renderTree(); renderHead(); refreshScene(true);
  toast(`${lv.name} added · its floor plan is missing`);
};

const params = new URLSearchParams(location.search);
try {
  if (params.get('d')) await openDrawing(params.get('d'));
  else if (params.get('p')?.startsWith('local-')) {
    const local = getLocalProject(params.get('p'));
    if (!local) throw new Error('This building was started in another browser');
    await openProject(local);
  } else if (params.get('p')) await openProject(await loadProject(params.get('p')));
  else location.replace('home.html');
} catch (e) {
  toast(e.message || 'Could not open this');
  setTimeout(() => location.replace('home.html'), 1600);
}
</script>
</body>
</html>
