[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ymir-ask-runtime"
version = "0.1.0"
description = "Vendored Stoa Lens and native geometry runtime for Ymir"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31", "Pillow>=10.4", "PyMuPDF>=1.24", "jsonschema==4.25.0",
  "openai==1.102.0", "shapely>=2.1,<3", "ifcopenshell==0.9.0.post1", "defusedxml==0.7.1"
]

[project.scripts]
stoa-lens = "stoa_lens.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vista = ["core/prompts/*.md"]
